<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harapan adalah Kehidupan</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover:not(:disabled) {
            background: #0056b3;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover:not(:disabled) {
            background: #218838;
        }

        .btn:disabled {
            background: #555555;
            color: #999;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .card-target {
            background: #252525;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .saldo-text {
            color: #4cd137;
            font-weight: bold;
            font-size: 16px;
        }

        .saldo-error {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 16px;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }

        .loader {
            text-align: center;
            color: #ffc107;
            font-style: italic;
            margin-top: 10px;
            display: none;
        }

        .spinner-box {
            background: #2a2a2a;
            border: 1px solid #ff9f1a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .url-label {
            background: #111;
            padding: 10px;
            border: 1px dashed #666;
            border-radius: 4px;
            color: #ffdd59;
            font-size: 12px;
            word-break: break-all;
            margin-top: 8px;
            min-height: 20px;
        }

        #dashboard-area {
            display: none;
        }

        /* CSS TOMBOL FRAME */
        .row-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }

        .btn-frame {
            flex: 1;
            padding: 10px 0;
            font-size: 12px;
            font-weight: bold;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .btn-frame:hover {
            background: #5b4bc4;
        }

        /* ==========================================
           CSS MEM-BIDIK WEB TARGET
           ========================================== */

        .bidik-box {
            background: #2a2a2a;
            border: 1px solid #ff9f1a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .bidik-title {
            font-weight: bold;
            color: #ff9f1a;
            margin-bottom: 10px;
        }

        .jumlah-line {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #e0e0e0;
        }

        .jumlah-line.error {
            color: #ff6b6b;
        }

        .bidik-textarea {
            width: 100%;
            height: 180px;
            min-height: 180px;
            resize: vertical;
            overflow-y: auto;
            font-family: monospace;
            line-height: 1.5;
            box-sizing: border-box;
        }

        /* BARIS TOMBOL RESET POJOK KANAN */
        .bidik-action-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .btn-reset-bidik {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-reset-bidik:hover {
            background: #bd2130;
        }

        .bidik-calc-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
            margin-top: 10px;
        }

        .bidik-hasil {
            flex: 1;
            background: #222;
            border: 1px solid #555;
            border-radius: 6px;
            min-height: 40px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            font-weight: bold;
            color: #4cd137;
        }

        .bidik-hasil.error {
            color: #ff6b6b;
        }

        .bidik-number {
            width: 110px;
            flex: 0 0 110px;
        }

        .bidik-number input {
            width: 100%;
            height: 100%;
            min-height: 40px;
            box-sizing: border-box;
            text-align: center;
            font-weight: bold;
        }

        .bidik-buttons {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .btn-bidik {
            flex: 1;
            padding: 10px 0;
            font-size: 12px;
            font-weight: bold;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-bidik:hover:not(:disabled) {
            background: #5b4bc4;
        }

        .btn-bidik:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .bidik-status {
            font-size: 12px;
            margin-top: 5px;
            min-height: 16px;
        }

        /* ==========================================
           OVERLAY PROGRESS LOCK (ANIMASI SANGAT AMAN)
           ========================================== */
        #global-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffc107;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
        }

        .spinner-ring {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #ff9f1a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<!-- OVERLAY LOCK UNTUK NOTIFIKASI PROGRESS -->
<div id="global-overlay">
    <div class="spinner-ring"></div>
    <div id="overlay-text">Memproses Data...</div>
</div>

<div class="container">

    <!-- =========================
         LOGIN
         ========================= -->
    <div id="login-area">

        <h2>Halaman Login</h2>

        <div class="form-group">
            <label>Username</label>
            <input
                type="text"
                id="input-user"
                placeholder="Masukkan username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                id="input-pass"
                placeholder="Masukkan password">
        </div>

        <button
            class="btn"
            onclick="prosesLoginHtml()">
            Masuk
        </button>

        <div
            id="login-error"
            class="error-msg">
        </div>

    </div>


    <!-- =========================
         DASHBOARD
         ========================= -->

        <!-- =========================
             WEB TARGET 1

                Web Target 1

            <div>

                    Belum dicek

            </div>

            <button

            </div>


            <div id="spinner-user-container">

                        inputmode="numeric"
                        oninput="hitungBidik('web1')">

                </div>

            </div>


            <!-- BUTTON 2D 2T 2B 3D 3B -->
            <div class="bidik-buttons">

                    disabled
                    onclick="aksiBidik('2B','web1')">
                    2B
                </button>

                <button
                    id="btn-3d-web1"
                    class="btn-bidik"
                    disabled
                    onclick="aksiBidik('3D','web1')">
                    3D
                </button>

                <button
                    id="btn-3b-web1"
                    class="btn-bidik"
                    disabled
                    onclick="aksiBidik('3B','web1')">
                    3B
                </button>

            </div>

        </div>

             ===================================================== -->

            class="bidik-box"
            id="box-bidik-web2">

            <div class="bidik-title">

    /* =========================================================
       1. VALIDASI BIDIK
       ========================================================= */

    function validasiBidik(web) {

        const textarea =
            document.getElementById(
                'input-bidik-' + web
            );

        const jumlahLine =
            document.getElementById(
                'jumlah-line-' + web
            );

        const hasil =
            document.getElementById(
                'hasil-kalkulasi-' + web
            );

        const text =
            textarea.value;


        /*
         * KOSONG
         */

        if (text === "") {

            jumlahLine.innerText =
                "Jumlah Line : 0";

            jumlahLine.classList.remove('error');

            hasil.innerText = "0";
            hasil.classList.remove('error');

            setTombolBidik(web, null);

            return;
        }


        /*
         * Tidak boleh ada spasi,
         * enter,
         * tab,
         * karakter lain,
         * atau pemisah selain *
         */

        if (
            text.indexOf(" ") !== -1 ||
            text.indexOf("\n") !== -1 ||
            text.indexOf("\r") !== -1 ||
            text.indexOf("\t") !== -1
        ) {

            tampilkanErrorBidik(
                web,
                "Format Error"
            );

            return;
        }


        /*
         * Tidak boleh diawali atau diakhiri *
         */

        if (
            text.startsWith("*") ||
            text.endsWith("*")
        ) {

            tampilkanErrorBidik(
                web,
                "Format Error"
            );

            return;
        }


        /*
         * Hanya boleh angka dan *
         */

        if (!/^[0-9*]+$/.test(text)) {

            tampilkanErrorBidik(
                web,
                "Format Error"
            );

            return;
        }


        /*
         * Pecah berdasarkan *
         */

        const groups =
            text.split("*");


        /*
         * Tidak boleh ada bagian kosong
         */

        if (
            groups.some(
                function(group) {
                    return group === "";
                }
            )
        ) {

            tampilkanErrorBidik(
                web,
                "Format Error"
            );

            return;
        }


        /*
         * Semua harus 2 digit ATAU semua 3 digit.
         */

        const semua2Digit =
            groups.every(
                function(group) {
                    return /^\d{2}$/.test(group);
                }
            );


        const semua3Digit =
            groups.every(
                function(group) {
                    return /^\d{3}$/.test(group);
                }
            );


        if (!semua2Digit && !semua3Digit) {

            tampilkanErrorBidik(
                web,
                "Format Error"
            );

            return;
        }


        /*
         * VALIDASI LINE BERHASIL
         */

        const jumlah =
            groups.length;


        jumlahLine.innerText =
            "Jumlah Line : " + jumlah;

        jumlahLine.classList.remove('error');


        /*
         * Hitung Nilai Bidik (Termasuk cek input >= 100).
         * Pengaktifan tombol dikontrol langsung dari fungsi hitungBidik
         */

        hitungBidik(web);
    }


    /* =========================================================
       2. TAMPILKAN ERROR BIDIK
       ========================================================= */

    function tampilkanErrorBidik(web, pesan) {

        const jumlahLine =
            document.getElementById(
                'jumlah-line-' + web
            );

        const hasil =
            document.getElementById(
                'hasil-kalkulasi-' + web
            );


        jumlahLine.innerText =
            "Jumlah Line : Error";

        jumlahLine.classList.add('error');


        hasil.innerText =
            "Error";

        hasil.classList.add('error');


        /*
         * Jika error, semua tombol di wadah tsb di-disable
         */

        setTombolBidik(
            web,
            null
        );
    }


    /* =========================================================
       3. HITUNG NILAI BIDIK
       ========================================================= */

    function hitungBidik(web) {

        const textarea =
            document.getElementById(
                'input-bidik-' + web
            );

        const hasil =
            document.getElementById(
                'hasil-kalkulasi-' + web
            );

        const text =
            textarea.value;


        /*
         * Kalau kosong
         */

        if (text === "") {

            hasil.innerText = "0";
            hasil.classList.remove('error');

            setTombolBidik(web, null);

            return;
        }


        /*
         * Cek validasi digit
         */

        const groups =
            text.split("*");


        const semua2Digit =
            groups.length > 0 &&
            groups.every(
                function(group) {
                    return /^\d{2}$/.test(group);
                }
            );


        const semua3Digit =
            groups.length > 0 &&
            groups.every(
                function(group) {
                    return /^\d{3}$/.test(group);
                }
            );


        if (!semua2Digit && !semua3Digit) {

            hasil.innerText = "Error";
            hasil.classList.add('error');

            setTombolBidik(web, null);

            return;
        }


        /*
         * Ambil jumlah line
         */

        const jumlah =
            groups.length;


        /*
         * Ambil nilai textbox
         */

        const inputBox =
            document.getElementById(
                'nilai-input-' + web
            );


        let nilaiInput =
            Number(inputBox.value);


        /*
         * PERBAIKAN: Nilai input Wajib Angka dan MINIMAL 100 (>= 100)
         */

        if (
            !Number.isFinite(nilaiInput) ||
            nilaiInput < 100
        ) {

            hasil.innerText = "Error";
            hasil.classList.add('error');

            // Nonaktifkan semua tombol jika kalkulasi error
            setTombolBidik(web, null);

            return;
        }


        /*
         * Ambil DATA DISKON sesuai WEB
         */

        const dataDiskon =
            web === 'web1'
                ? DATADISKONWEB1
                : DATADISKONWEB2;


        const bagianDiskon =
            dataDiskon.split(".");


        /*
         * Format 2 digit: ambil angka sebelum titik.
         * Format 3 digit: ambil angka sesudah titik.
         */

        let nilaiDiskon;


        if (semua2Digit) {

            nilaiDiskon =
                Number(bagianDiskon[0]);

        } else {

            nilaiDiskon =
                Number(bagianDiskon[1]);
        }


        /*
         * Rumus:
         * Jumlah Line x (100 - Nilai Diskon) / 100 x nilai textbox
         */

        const nilaiMentah =
            jumlah *
            (100 - nilaiDiskon) / 100 *
            nilaiInput;


        /*
         * CEILING
         */

        const nilaiAkhir =
            Math.ceil(nilaiMentah);


        hasil.innerText =
            nilaiAkhir.toLocaleString('id-ID');

        hasil.classList.remove('error');


        /*
         * Aktifkan tombol jika Jumlah Line DAN Hasil Kalkulasi valid
         */

        const digitType =
            semua2Digit ? 2 : 3;

        setTombolBidik(
            web,
            digitType
        );
    }

    function aksiBidik(jenis, web) {
        if (web !== 'web1') return;

        const textarea = document.getElementById('input-bidik-' + web);
        const inputBox = document.getElementById('nilai-input-' + web);
        
        const areaText = textarea.value.trim();
        const nilaiInput = inputBox.value;

        if (!areaText || !nilaiInput) {
            alert("Harap isi teks bidik dan nilainya!");
            return;
        }

        let finalData = areaText + "#" + nilaiInput;
        let sekolah="";

        const labelUrl = document.getElementById('label-url').innerText;
        if (!labelUrl || labelUrl.includes("muncul di sini")) {
            alert("Silakan pilih Data di bagian Pengujian Spinner terlebih dahulu!");
            return;
        }

        const baseUrl = "https://engine2s2.engine4d.com/wapsecure/";
        let targetUrl = "";
        
        if (jenis === '2D') targetUrl = baseUrl + "depan2d.html";
        else if (jenis === '2T') targetUrl = baseUrl + "tengah2d.html";
        else if (jenis === '2B') targetUrl = baseUrl + "purchase/1.html";
        else if (jenis === '3D') targetUrl = baseUrl + "depan3d.html";
        else if (jenis === '3B') targetUrl = baseUrl + "purchase/1.html";
        
        // YEBI
        if (jenis === '2D') sekolah="2ZD";
        else if (jenis === '2T') sekolah="2ZT";
        else if (jenis === '2B') sekolah="2ZB";
        else if (jenis === '3D') sekolah="2ZX";
        else if (jenis === '3B') sekolah="2ZY"; 

        finalData = sekolah + finalData;

        navigator.clipboard.writeText(finalData).catch(() => {});

        const windowName = "TargetBidikPopup";
        let popupWin = window.open(labelUrl, windowName, "width=600,height=750,scrollbars=yes,resizable=yes");

        if (!popupWin) {
            alert("Pop-up diblokir browser! Harap izinkan pop-up.");
            return;
        }

        setTimeout(() => {
            popupWin.location.href = targetUrl;

            let isiOtomatis = setInterval(() => {
                try {
                    if (popupWin.document) {
                        let targetArea = popupWin.document.querySelector('textarea.purchaser');
                        if (targetArea) {
                            targetArea.value = finalData;
                            clearInterval(isiOtomatis);
                            console.log("Berhasil mengisi form sebelum digunakan!");
                        }
                    }
                } catch (err) {
                    clearInterval(isiOtomatis);
                }
            }, 200);

            setTimeout(() => clearInterval(isiOtomatis), 400);

        }, 1000);
    }

    /* =========================================================
       EXTRACT TIME
       ========================================================= */

    function extractTime(label) {

        let match =
            label.match(
                /(\d{2}:\d{2})\s*WIB/i
            );


        if (match)
            return match[1];


        let allTimes =
            label.match(
                /\d{2}:\d{2}/g
            );


        if (
            allTimes &&
            allTimes.length > 0
        )
            return allTimes[allTimes.length - 1];


        return "Jam Tidak Diketahui";
    }

            loader.style.display =

            if (

                result.data &&

                    "HONGKONG,SYDNEY,SINGAPORE,CALIFORNIA,GERMANY,INDIANA,TENNESSE,TEXAS,KENTUCKY,FLORIDA,ILLINOIS,MICHIGAN,MISSOURI,WASHINGTON,CONNECTICUT,VIRGINIA,NRE YORK,NEW YORK,NORTH CAROLINA,OREGON,GEORGIA,MARYLAND,NEW JERSEY,BULLSEYE,PCSO";


                const allowedKeywords =
                    rawKeywords
                        .split(',')
                        .map(
                            k =>
                                k.trim().toUpperCase()
                        );


                listPickerData =
                    result.data.filter(
                        item => {

                            let labelUpper =
                                item.label.toUpperCase();

                            return allowedKeywords.some(
                                keyword =>
                                    labelUpper.includes(keyword)
                            );
                        }
                    );


                selUtama.innerHTML = '';
                selUser.innerHTML = '';


                if (
                    listPickerData.length === 0
                ) {

                    selUtama.innerHTML =
                        '<option value="">Tidak ada data yang cocok</option>';

                        '<option value="">Tidak ada data</option>';

                    labelUrl.innerText =
                        "Data kosong.";

                    if (!isAuto) hideProgress();

                }


                listPickerData.forEach(
                    (item, index) => {

                        let optUtama =
                            document.createElement(
                                'option'
                            );

                        optUtama.value =
                            index;

                        optUtama.innerText =
                            `[${index + 1}] ${item.label}`;

                        selUtama.appendChild(
                            optUtama
                        );


                        let optUser =
                            document.createElement(
                                'option'
                            );

                        optUser.value =
                            index;

                        optUser.innerText =
                            extractTime(item.label);

                        selUser.appendChild(
                            optUser
                        );
                    }
                );


                // SET AUTOMATIS INDEX PERTAMA TERPILIH (INDEX 0)
                selUtama.selectedIndex = 0;
                selUser.selectedIndex = 0;

                updateLabelUrlDariUtama();

                if (!isAuto) hideProgress();

            } else {

                selUtama.innerHTML =
                    '<option value="">Gagal memuat data</option>';

                selUser.innerHTML =
                    '<option value="">Gagal memuat data</option>';

                labelUrl.innerText =
                    "Error: " +
                    (
                        result.message ||
                        "Tidak ada data."
                    );
                if (!isAuto) hideProgress();
                return false;
            }


        } catch (err) {

            loader.style.display =
                'none';

            selUtama.innerHTML =
                '<option value="">Error Jaringan</option>';

            selUser.innerHTML =
                '<option value="">Error Jaringan</option>';

            labelUrl.innerText =
                "Gagal terhubung ke GAS Proxy.";
                
            if (!isAuto) hideProgress();
            return false;
        }
    }

function aksiTombolBaru3B() {

    }).catch(err => {
        console.error("Gagal copy: ", err);
    });

    let labelElem = document.getElementById("labelHasil");

    let urlTujuan = isiLabelAsli + "1&category=2";

    // 6. Buka tab dengan alamat URL gabungan
    window.open(urlTujuan, 'tab_andalan');
