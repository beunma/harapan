<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<title>PeerJS Video Call Full Audio</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
	<script src="./peerjs.min.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html, body {
			width: 100%;
			height: 100vh;
			background-color: #121212;
			font-family: Arial, sans-serif;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.video-box {
			width: 100%;
			height: 38vh;
			position: relative;
			background-color: #000;
			border-bottom: 2px solid #333;
		}

		.video-box video {
			width: 100%;
			height: 100%;
			position: absolute;
			top: 0;
			left: 0;
			object-fit: cover;
		}

		#local-video {
			transform: rotateY(180deg);
		}

		.controls {
			height: 24vh;
			padding: 10px;
			background-color: #1e1e1e;
			color: #fff;
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.btn-group {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
		}

		button {
			flex: 1;
			min-width: 90px;
			padding: 10px;
			background-color: #007bff;
			color: #fff;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-weight: bold;
			font-size: 13px;
		}

		button:hover { opacity: 0.9; }
		.btn-danger { background-color: #dc3545; }
		.btn-success { background-color: #28a745; }

		#log-output {
			flex: 1;
			background-color: #000;
			color: #00ff00;
			font-family: monospace;
			font-size: 11px;
			padding: 6px;
			border-radius: 4px;
			overflow-y: auto;
			white-space: pre-wrap;
		}

		.modal-overlay {
			display: none;
			position: fixed;
			top: 0; left: 0; width: 100%; height: 100%;
			background-color: rgba(0, 0, 0, 0.85);
			z-index: 999;
			justify-content: center;
			align-items: center;
			flex-direction: column;
		}

		.modal-box {
			background: #2a2a2a;
			padding: 20px;
			border-radius: 8px;
			text-align: center;
			color: #fff;
			width: 85%;
			max-width: 320px;
			box-shadow: 0 4px 15px rgba(0,0,0,0.5);
		}

		.modal-box h3 { margin-bottom: 10px; color: #ffc107; }
		.modal-box p { margin-bottom: 20px; font-size: 14px; }
		.modal-btns { display: flex; gap: 10px; }
	</style>
</head>
<body>

	<!-- Video Lawan (Atas) -->
	<div class="video-box">
		<video id="remote-video" autoplay playsinline></video>
	</div>

	<!-- Video Sendiri (Tengah) -->
	<div class="video-box">
		<video id="local-video" autoplay muted playsinline></video>
	</div>

	<!-- Kontrol & Log (Bawah) -->
	<div class="controls">
		<div class="btn-group">
			<button class="btn-success" onclick="initCamAndPeer()">Camera</button>
			<button onclick="triggerCalling()">Calling</button>
			<button class="btn-danger" onclick="hangup()">Tutup</button>
		</div>
		<div id="log-output">Klik "Aktifkan Kamera dahulu</div>
	</div>

	<!-- Popup Panggilan Masuk -->
	<div id="incoming-modal" class="modal-overlay">
		<div class="modal-box">
			<h3>Panggilan Masuk!</h3>
			<p id="caller-info">ID xxxxxx sedang menghubungi...</p>
			<div class="modal-btns">
				<button class="btn-success" onclick="acceptCall()">Terima</button>
				<button class="btn-danger" onclick="rejectCall()">Tolak</button>
			</div>
		</div>
	</div>

	<script>
		var peer = null;
		var conn = null;
		var localStream = null;
		var incomingCallObj = null;
		var audioCtx = null;
		var ringtoneInterval = null;

		const remoteVideo = document.getElementById('remote-video');
		const localVideo = document.getElementById('local-video');
		const logOutput = document.getElementById('log-output');
		const modal = document.getElementById('incoming-modal');
		const callerInfo = document.getElementById('caller-info');

		// 1. Inisialisasi Akses Kamera + Mic
		async function initCamAndPeer() {
			const myID = prompt("Masukkan ID Anda (Misal: 111111):", "111111");
			if (!myID) return;

			if (!audioCtx) {
				audioCtx = new (window.AudioContext || window.webkitAudioContext)();
			}

			logOutput.innerText = "Mengambil akses Kamera dan Mikrofon...\n" + logOutput.innerText;

			// Minta Izin Kamera (true) dan Mic (true) sekaligus
			await startLocal();

			if (localStream) {
				connect(myID);
			} else {
				alert("Gagal mengakses Kamera/Mikrofon. Pastikan izin browser sudah Allow.");
			}
		}

		function connect(myid) {
			logOutput.innerText = "Koneksi ke server PeerJS ID: " + myid + "...\n" + logOutput.innerText;

			if (peer) {
				peer.destroy();
			}

			peer = new Peer(myid, {
				debug: 2,
				config: {
					'iceServers': [
						{ urls: 'stun:stun.l.google.com:19302' },
						{ urls: 'stun:stun1.l.google.com:19302' },
						{ urls: 'stun:stun2.l.google.com:19302' },
						{ urls: 'stun:stun3.l.google.com:19302' },
						{ urls: 'stun:stun4.l.google.com:19302' }
					],
					'sdpSemantics': 'unified-plan'
				}
			});

			peer.on('open', id => {
				feedback({ event: "open", id: id });
				alert("BERHASIL ONLINE! ID Anda: " + id);
			});

			peer.on('call', callObj => {
				incomingCallObj = callObj;
				conn = callObj;

				callerInfo.innerText = "ID " + callObj.peer + " sedang menghubungi...";
				modal.style.display = "flex";
				
				startRingtone();
				feedback({ event: "incoming_call", from: callObj.peer });
			});

			peer.on('disconnected', () => {
				feedback({ event: "disconnected" });
			});

			peer.on("error", err => {
				alert("Error PeerJS: " + err.type);
				feedback({ event: "error", err: err.type });
			});
		}

		function startLocal() {
			return navigator.mediaDevices.getUserMedia({
				video: true,
				audio: {
					echoCancellation: true,
					noiseSuppression: true,
					autoGainControl: true
				}
			})
			.then(stream => {
				localVideo.srcObject = stream;
				localStream = stream;
				feedback({ event: "localStreamStarted" });
			})
			.catch(err => {
				localStream = null;
				feedback({ event: "error", err: "Mic/Cam error: " + err.message });
			});
		}

		// Memasang dan Mengaktifkan Suara Remote
		function attachRemoteStream(remoteStream) {
			remoteVideo.srcObject = remoteStream;
			remoteVideo.muted = false; // Buka mute remote
			remoteVideo.volume = 1.0;  // Set volume maksimal

			// Trik melepaskan blokir Autoplay Chrome
			var playPromise = remoteVideo.play();
			if (playPromise !== undefined) {
				playPromise.then(() => {
					feedback({ event: "stream_playing_audio_active" });
				}).catch(e => {
					logOutput.innerText = "Klik sembarang layar untuk membunyikan suara!\n" + logOutput.innerText;
				});
			}
			feedback({ event: "stream_connected" });
		}

		function triggerCalling() {
			if (!peer || peer.destroyed || !peer.open) {
				alert("Klik 'Aktifkan Kamera & Peer' dulu!");
				return;
			}

			if (!localStream) {
				alert("Kamera/Mic belum aktif!");
				return;
			}

			const targetID = prompt("Masukkan ID Tujuan (Misal Laptop: 222222):");
			if (targetID === null) return;

			if (!targetID) {
				alert("ID Tujuan tidak boleh kosong!");
				return;
			}

			call(targetID);
		}

		function call(peerid) {
			// Kirim localStream (Kamera + Mic) ke lawan
			const callObj = peer.call(peerid, localStream);

			if (!callObj) {
				alert("Gagal memanggil ID tujuan.");
				return;
			}

			callObj.on('stream', remoteStream => {
				attachRemoteStream(remoteStream);
			});

			callObj.on("close", () => {
				hangup();
			});

			callObj.on("error", err => {
				feedback({ event: "error", err: err.type });
			});
			conn = callObj;
		}

		function acceptCall() {
			stopRingtone();
			modal.style.display = "none";

			if (incomingCallObj && localStream) {
				// Jawab panggilan sambil mengirimkan localStream (Kamera + Mic)
				incomingCallObj.answer(localStream);

				incomingCallObj.on('stream', remoteStream => {
					attachRemoteStream(remoteStream);
				});

				incomingCallObj.on("close", () => {
					hangup();
				});
			}
		}

		function rejectCall() {
			stopRingtone();
			modal.style.display = "none";

			if (incomingCallObj) {
				incomingCallObj.close();
				incomingCallObj = null;
				conn = null;
			}
			feedback({ event: "call_rejected" });
		}

		function hangup() {
			stopRingtone();
			modal.style.display = "none";

			if (conn) {
				conn.close();
				conn = null;
			}
			remoteVideo.srcObject = null;
			feedback({ event: "hangup" });
		}

		function playRingTonePulse() {
			if (!audioCtx) return;
			try {
				let osc1 = audioCtx.createOscillator();
				let osc2 = audioCtx.createOscillator();
				let gain = audioCtx.createGain();

				osc1.frequency.value = 440;
				osc2.frequency.value = 480;

				osc1.connect(gain);
				osc2.connect(gain);
				gain.connect(audioCtx.destination);

				let now = audioCtx.currentTime;
				gain.gain.setValueAtTime(0.15, now);
				gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

				osc1.start(now);
				osc2.start(now);
				osc1.stop(now + 1.2);
				osc2.stop(now + 1.2);
			} catch (e) {}
		}

		function startRingtone() {
			stopRingtone();
			playRingTonePulse();
			ringtoneInterval = setInterval(playRingTonePulse, 2500);
		}

		function stopRingtone() {
			if (ringtoneInterval) {
				clearInterval(ringtoneInterval);
				ringtoneInterval = null;
			}
		}

		function feedback(log) {
			const msg = JSON.stringify(log);
			logOutput.innerText = msg + "\n" + logOutput.innerText;

			if (window.AppInventor) {
				window.AppInventor.setWebViewString(msg);
			} else {
				console.log(msg);
			}
		}
	</script>
</body>
</html>
