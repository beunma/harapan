<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analisa Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;
        background: #111;
        color: #eee;
    }

    .container {
        width: 100%;
        max-width: 1100px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin: 0 0 20px 0;
        font-size: 28px;
        color: #00eaff;
    }

    .box {
        background: #1c1c1c;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 18px;
    }

    .judul {
        font-size: 20px;
        font-weight: bold;
        color: #ffd54a;
        margin-bottom: 10px;
    }

    textarea {
        width: 100%;
        resize: vertical;
        min-height: 150px;
        background: #090909;
        color: #fff;
        border: 1px solid #555;
        border-radius: 7px;
        padding: 12px;
        font-size: 17px;
        line-height: 1.5;
        outline: none;
    }

    textarea:focus {
        border-color: #00eaff;
    }

    #dataInput {
        min-height: 180px;
    }

    .textarea-wrap {
        position: relative;
    }

    .textarea-buttons {
        position: absolute;
        right: 8px;
        bottom: 8px;
        display: flex;
        gap: 6px;
    }

    button {
        border: none;
        border-radius: 6px;
        padding: 9px 15px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }

    .btn-reset {
        background: #d32f2f;
        color: white;
    }

    .btn-paste {
        background: #1976d2;
        color: white;
    }

    .btn-proses {
        width: 100%;
        margin-top: 12px;
        background: #00a884;
        color: white;
        font-size: 18px;
        padding: 13px;
    }

    .btn-stop {
        background: #ff9800;
        color: #111;
        font-size: 15px;
        min-width: 90px;
    }

    .status-valid {
        margin-top: 8px;
        font-weight: bold;
        font-size: 14px;
    }

    .valid {
        color: #00e676;
    }

    .invalid {
        color: #ff5252;
    }

    .setting-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .setting-item label {
        display: block;
        margin-bottom: 6px;
        color: #bbb;
        font-weight: bold;
    }

    .setting-item input {
        width: 100%;
        padding: 11px;
        border-radius: 6px;
        border: 1px solid #555;
        background: #090909;
        color: white;
        font-size: 17px;
        outline: none;
    }

    .setting-item input:focus {
        border-color: #00eaff;
    }

    .hasil-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .hasil-box {
        position: relative;
    }

    .hasil-title {
        color: #00eaff;
        font-size: 19px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .hasil-textarea {
        min-height: 180px;
        padding-bottom: 45px;
        font-family: Consolas, monospace;
        font-size: 15px;
    }

    .btn-copy {
        position: absolute;
        right: 8px;
        bottom: 8px;
        background: #1976d2;
        color: white;
        padding: 7px 12px;
        font-size: 12px;
    }

    #progressOverlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.78);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        padding: 20px;
    }

    #progressDialog {
        width: 100%;
        max-width: 650px;
        background: #202020;
        border: 1px solid #555;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
    }

    .progress-title {
        font-size: 21px;
        font-weight: bold;
        color: #00eaff;
    }

    .progress-info {
        background: #090909;
        border: 1px solid #444;
        border-radius: 7px;
        padding: 12px;
        min-height: 150px;
        font-family: Consolas, monospace;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-y: auto;
        max-height: 300px;
    }

    .progress-bar-bg {
        width: 100%;
        height: 15px;
        background: #080808;
        border-radius: 10px;
        overflow: hidden;
        margin: 15px 0;
        border: 1px solid #444;
    }

    #progressBar {
        width: 0%;
        height: 100%;
        background: #00c853;
        transition: width 0.05s linear;
    }

    .progress-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    #progressPercent {
        color: #00e676;
        font-weight: bold;
    }

    .done-message {
        color: #00e676;
        font-weight: bold;
    }

    .break-message {
        color: #ffb300;
        font-weight: bold;
    }

    @media (max-width: 800px) {

        .hasil-grid {
            grid-template-columns: 1fr;
        }

        .setting-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<body>

<div class="container">

    <!-- <h1>Analisa Generator 2D</h1> -->

    <div class="box">

        <div class="textarea-wrap">

            <textarea

            <div class="textarea-buttons">

        </div>

<script>

const dataInput       = document.getElementById("dataInput");
const inputStatus     = document.getElementById("inputStatus");

const minHitInput     = document.getElementById("minHit");
const maxGenInput     = document.getElementById("maxGen");

const btnProses       = document.getElementById("btnProses");
const btnReset        = document.getElementById("btnReset");
const btnPaste        = document.getElementById("btnPaste");

const hasil2DD        = document.getElementById("hasil2DD");
const hasil2DT        = document.getElementById("hasil2DT");
const hasil2DB        = document.getElementById("hasil2DB");

const title2DD        = document.getElementById("title2DD");
const title2DT        = document.getElementById("title2DT");
const title2DB        = document.getElementById("title2DB");

const progressOverlay = document.getElementById("progressOverlay");
const progressInfo    = document.getElementById("progressInfo");
const progressBar     = document.getElementById("progressBar");
const progressPercent = document.getElementById("progressPercent");
const progressState   = document.getElementById("progressState");
const btnStop         = document.getElementById("btnStop");


/* =========================================================
   INPUT
   ========================================================= */

function setDefaultMinHit() {

    const parsed = parseInputData();

    if (parsed.valid) {

        minHitInput.value =
            parsed.data.length - 1;
    }
}


function parseInputData() {

    const raw = dataInput.value.trim();

    if (raw === "") {

        return {
            valid: false,
            data: [],
            reason: "Kosong"
        };
    }

    const parts = raw.split(",");

    const data = [];

    for (let i = 0; i < parts.length; i++) {

        const value = parts[i].trim();

        if (!/^\d{4}$/.test(value)) {

            return {
                valid: false,
                data: [],
                reason:
                    "Data ke-" +
                    (i + 1) +
                    " harus tepat 4 digit"
            };
        }

        data.push(value);
    }

    if (data.length < 2) {

        return {
            valid: false,
            data: data,
            reason: "Minimal 2 data 4D"
        };
    }

    return {
        valid: true,
        data: data,
        reason: ""
    };
}


function validateAll() {

    const parsed = parseInputData();

    const minHit = Number(minHitInput.value);
    const maxGen = Number(maxGenInput.value);

    const settingsValid =
        Number.isInteger(minHit) &&
        minHit >= 1 &&
        Number.isInteger(maxGen) &&
        maxGen >= 1;

    if (!parsed.valid) {

        inputStatus.textContent =
            "✖ " + parsed.reason;

        inputStatus.className =
            "status-valid invalid";

        btnProses.disabled = true;

        return false;
    }

    if (!settingsValid) {

        inputStatus.textContent =
            "✖ Pengaturan belum valid";

        inputStatus.className =
            "status-valid invalid";

        btnProses.disabled = true;

        return false;
    }

    const jumlahPasangan =
        parsed.data.length - 1;

    if (minHit > jumlahPasangan) {

        inputStatus.textContent =
            "✖ Minimal hit tidak boleh lebih dari " +
            jumlahPasangan;

        inputStatus.className =
            "status-valid invalid";

        btnProses.disabled = true;

        return false;
    }

    inputStatus.textContent =
        "✔ Data valid: " +
        parsed.data.length +
        " data 4D / " +
        jumlahPasangan +
        " pasangan";

    inputStatus.className =
        "status-valid valid";

    btnProses.disabled = false;

    return true;
}


dataInput.addEventListener("input", function() {

    const parsed = parseInputData();

    if (parsed.valid) {

        minHitInput.value =
            parsed.data.length - 1;
    }

    validateAll();
});


minHitInput.addEventListener(
    "input",
    validateAll
);

maxGenInput.addEventListener(
    "input",
    validateAll
);


btnReset.addEventListener("click", function() {

    dataInput.value = "";

    minHitInput.value = "";

    hasil2DD.value = "";
    hasil2DT.value = "";
    hasil2DB.value = "";

    title2DD.textContent = "2DD";
    title2DT.textContent = "2DT";
    title2DB.textContent = "2DB";

    inputStatus.textContent =
        "Data belum valid";

    inputStatus.className =
        "status-valid invalid";

    btnProses.disabled = true;
});


btnPaste.addEventListener(
    "click",
    async function() {

        try {

            const text =
                await navigator.clipboard.readText();

            dataInput.value = text;

            const parsed =
                parseInputData();

            if (parsed.valid) {

                minHitInput.value =
                    parsed.data.length - 1;
            }

            validateAll();

        } catch (error) {

            console.log(
                "Clipboard tidak dapat dibaca: " +
                error.message
            );
        }
    }
);


/* =========================================================
   COPY
   ========================================================= */

document
.querySelectorAll(".btn-copy")
.forEach(function(button) {

    button.addEventListener(
        "click",
        async function() {

            const id =
                button.getAttribute(
                    "data-copy"
                );

            const textarea =
                document.getElementById(id);

            try {

                await navigator.clipboard.writeText(
                    textarea.value
                );

                console.log(
                    "Hasil " +
                    id +
                    " berhasil dicopy."
                );

            } catch (error) {

                console.log(
                    "Gagal copy: " +
                    error.message
                );
            }
        }
    );
});


/* =========================================================
   STOP
   ========================================================= */

let stopRequested = false;

btnStop.addEventListener(
    "click",
    function() {

        stopRequested = true;

        progressState.textContent =
            "Menghentikan proses...";
    }
);


/* =========================================================
   UTILITAS DIGIT
   ========================================================= */

function cyclicDigit(digit, offset) {

    return (
        (Number(digit) +
            offset +
            10) % 10
    );
}


function generate49(seed) {

    seed =
        String(seed)
        .padStart(2, "0")
        .slice(-2);

    const d1 = Number(seed[0]);
    const d2 = Number(seed[1]);

    const list1 = [];
    const list2 = [];

    for (
        let offset = -3;
        offset <= 3;
        offset++
    ) {

        list1.push(
            cyclicDigit(
                d1,
                offset
            )
        );

        list2.push(
            cyclicDigit(
                d2,
                offset
            )
        );
    }

    const result = [];

    for (
        let i = 0;
        i < list1.length;
        i++
    ) {

        for (
            let j = 0;
            j < list2.length;
            j++
        ) {

            result.push(
                String(list1[i]) +
                String(list2[j])
            );
        }
    }

    return {
        digit1: list1.join(""),
        digit2: list2.join(""),
        combinations: result
    };
}


function isHit(seed, target) {

    seed =
        String(seed)
        .padStart(2, "0");

    target =
        String(target)
        .padStart(2, "0");

    return generate49(seed)
        .combinations
        .includes(target);
}


/* =========================================================
   EKSPRESI MATEMATIKA
   =========================================================

   Variabel:

   A = digit pertama data sekarang
   B = digit kedua data sekarang

   P = digit pertama pasangan data sebelumnya
   Q = digit kedua pasangan data sebelumnya

   Formula TIDAK menggunakan target.

   Formula TIDAK menggunakan pairIndex.

   Formula yang sama dipakai pada semua pasangan.
   ========================================================= */

const UNARY_OPS = [
    "abs",
    "sq",
    "sum",
    "prod",
    "rev",
    "first",
    "last",
    "root"
];

const BINARY_OPS = [
    "+",
    "-",
    "*",
    "/",
    "%",
    "abs-"
];


const expressions = [];
const expressionMap = new Map();


function addExpression(expr) {

    if (expressionMap.has(expr.text)) {

        return expressionMap.get(
            expr.text
        );
    }

    const id =
        expressions.length;

    expr.id = id;

    expressions.push(expr);

    expressionMap.set(
        expr.text,
        id
    );

    return id;
}


function addAtom(name, index) {

    return addExpression({

        type: "atom",

        index: index,

        text: name,

        cost: 0
    });
}


function unaryText(op, childText) {

    if (op === "abs")
        return "ABS(" + childText + ")";

    if (op === "sq")
        return "SQ(" + childText + ")";

    if (op === "sum")
        return "DS(" + childText + ")";

    if (op === "prod")
        return "DP(" + childText + ")";

    if (op === "rev")
        return "REV(" + childText + ")";

    if (op === "first")
        return "FST(" + childText + ")";

    if (op === "last")
        return "LST(" + childText + ")";

    if (op === "root")
        return "ROOT(" + childText + ")";

    return op + "(" + childText + ")";
}


function binaryText(
    op,
    leftText,
    rightText
) {

    if (op === "abs-") {

        return (
            "ABS(" +
            leftText +
            "-" +
            rightText +
            ")"
        );
    }

    if (op === "/") {

        return (
            "DIV(" +
            leftText +
            "," +
            rightText +
            ")"
        );
    }

    if (op === "%") {

        return (
            "MOD(" +
            leftText +
            "," +
            rightText +
            ")"
        );
    }

    return (
        "(" +
        leftText +
        op +
        rightText +
        ")"
    );
}


function addUnary(
    op,
    childId
) {

    const child =
        expressions[childId];

    return addExpression({

        type: "unary",

        op: op,

        child: childId,

        text:
            unaryText(
                op,
                child.text
            ),

        cost:
            child.cost + 1
    });
}


function addBinary(
    op,
    leftId,
    rightId
) {

    let left =
        expressions[leftId];

    let right =
        expressions[rightId];

    /*
       Operasi komutatif dibuat satu bentuk
       supaya GEN tidak membuang waktu pada
       A+B dan B+A yang sama secara matematis.
    */

    if (
        op === "+" ||
        op === "*" ||
        op === "abs-"
    ) {

        if (
            left.text >
            right.text
        ) {

            const temp =
                leftId;

            leftId =
                rightId;

            rightId =
                temp;

            left =
                expressions[leftId];

            right =
                expressions[rightId];
        }
    }

    return addExpression({

        type: "binary",

        op: op,

        left: leftId,

        right: rightId,

        text:
            binaryText(
                op,
                left.text,
                right.text
            ),

        cost:
            left.cost +
            right.cost +
            1
    });
}


/* =========================================================
   MEMBANGUN PERPUSTAKAAN FORMULA
   ========================================================= */

function buildExpressionLibrary() {

    expressions.length = 0;

    expressionMap.clear();

    const atoms = [];

    atoms.push(
        addAtom("A", 0)
    );

    atoms.push(
        addAtom("B", 1)
    );

    atoms.push(
        addAtom("P", 2)
    );

    atoms.push(
        addAtom("Q", 3)
    );


    /*
       LEVEL 1:
       unary(atom)
       binary(atom,atom)
    */

    const unaryAtoms = [];

    for (
        let i = 0;
        i < atoms.length;
        i++
    ) {

        for (
            let u = 0;
            u < UNARY_OPS.length;
            u++
        ) {

            unaryAtoms.push(
                addUnary(
                    UNARY_OPS[u],
                    atoms[i]
                )
            );
        }
    }


    for (
        let b = 0;
        b < BINARY_OPS.length;
        b++
    ) {

        for (
            let i = 0;
            i < atoms.length;
            i++
        ) {

            for (
                let j = 0;
                j < atoms.length;
                j++
            ) {

                addBinary(
                    BINARY_OPS[b],
                    atoms[i],
                    atoms[j]
                );
            }
        }
    }


    /*
       NESTED:
       unary(binary(atom,atom))
    */

    const firstLevelBinary = [];

    for (
        let i = 0;
        i < expressions.length;
        i++
    ) {

        if (
            expressions[i].type ===
            "binary"
        ) {

            const left =
                expressions[
                    expressions[i].left
                ];

            const right =
                expressions[
                    expressions[i].right
                ];

            if (
                left.cost === 0 &&
                right.cost === 0
            ) {

                firstLevelBinary.push(
                    expressions[i].id
                );
            }
        }
    }


    for (
        let i = 0;
        i < firstLevelBinary.length;
        i++
    ) {

        for (
            let u = 0;
            u < UNARY_OPS.length;
            u++
        ) {

            addUnary(
                UNARY_OPS[u],
                firstLevelBinary[i]
            );
        }
    }


    /*
       NESTED:
       binary(unary(atom),atom)
       binary(atom,unary(atom))
    */

    for (
        let b = 0;
        b < BINARY_OPS.length;
        b++
    ) {

        for (
            let u = 0;
            u < unaryAtoms.length;
            u++
        ) {

            for (
                let a = 0;
                a < atoms.length;
                a++
            ) {

                addBinary(
                    BINARY_OPS[b],
                    unaryAtoms[u],
                    atoms[a]
                );

                addBinary(
                    BINARY_OPS[b],
                    atoms[a],
                    unaryAtoms[u]
                );
            }
        }
    }


    /*
       NESTED:
       unary(unary(atom))

       Contoh:

       SQ(DS(A))
       DS(SQ(A))
       DP(ABS(B))
       ROOT(SQ(P))
    */

    for (
        let i = 0;
        i < unaryAtoms.length;
        i++
    ) {

        for (
            let u = 0;
            u < UNARY_OPS.length;
            u++
        ) {

            addUnary(
                UNARY_OPS[u],
                unaryAtoms[i]
            );
        }
    }

    return expressions.length;
}


const EXPRESSION_COUNT =
    buildExpressionLibrary();


/*
   Setiap dua expression membentuk satu
   formula dasar.

   Lalu ada 8 mode output.
*/

const OUTPUT_MODES = 8;

const TOTAL_FORMULAS =
    EXPRESSION_COUNT *
    EXPRESSION_COUNT *
    OUTPUT_MODES;


/* =========================================================
   EVALUASI EKSPRESI
   ========================================================= */

function digitSum(value) {

    value =
        Math.abs(
            Math.trunc(value)
        );

    const text =
        String(value);

    let total = 0;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        total +=
            Number(text[i]);
    }

    return total;
}


function digitProduct(value) {

    value =
        Math.abs(
            Math.trunc(value)
        );

    const text =
        String(value);

    let total = 1;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        total *=
            Number(text[i]);
    }

    return total;
}


function reverseNumber(value) {

    value =
        Math.abs(
            Math.trunc(value)
        );

    const text =
        String(value);

    return Number(
        text
        .split("")
        .reverse()
        .join("")
    );
}


function firstDigit(value) {

    value =
        Math.abs(
            Math.trunc(value)
        );

    return Number(
        String(value)[0]
    );
}


function lastDigit(value) {

    return (
        Math.abs(
            Math.trunc(value)
        ) % 10
    );
}


function digitalRoot(value) {

    value =
        Math.abs(
            Math.trunc(value)
        );

    if (value === 0) {
        return 0;
    }

    while (value >= 10) {

        value =
            digitSum(value);
    }

    return value;
}


function evalUnary(
    op,
    value
) {

    if (op === "abs")
        return Math.abs(value);

    if (op === "sq")
        return value * value;

    if (op === "sum")
        return digitSum(value);

    if (op === "prod")
        return digitProduct(value);

    if (op === "rev")
        return reverseNumber(value);

    if (op === "first")
        return firstDigit(value);

    if (op === "last")
        return lastDigit(value);

    if (op === "root")
        return digitalRoot(value);

    return 0;
}


function evalBinary(
    op,
    left,
    right
) {

    if (op === "+")
        return left + right;

    if (op === "-")
        return left - right;

    if (op === "*")
        return left * right;

    if (op === "abs-")
        return Math.abs(
            left - right
        );

    if (op === "/") {

        if (right === 0)
            return 0;

        return Math.trunc(
            left / right
        );
    }

    if (op === "%") {

        if (right === 0)
            return 0;

        const divisor =
            Math.abs(
                Math.trunc(right)
            );

        if (divisor === 0)
            return 0;

        return (
            (
                Math.trunc(left) %
                divisor
            ) +
            divisor
        ) % divisor;
    }

    return 0;
}


/* =========================================================
   MEMBUAT VALUE TABLE
   =========================================================

   Semua expression dihitung SATU KALI untuk
   setiap pasangan data.

   Jadi saat GEN berjalan, engine tidak perlu
   menghitung ulang formula dari nol.
   ========================================================= */

function evaluateExpression(
    expr,
    vars,
    cache
) {

    if (
        cache[expr.id] !== undefined
    ) {

        return cache[expr.id];
    }

    let value = 0;

    if (expr.type === "atom") {

        value =
            vars[expr.index];
    }

    else if (
        expr.type === "unary"
    ) {

        const childValue =
            evaluateExpression(
                expressions[
                    expr.child
                ],
                vars,
                cache
            );

        value =
            evalUnary(
                expr.op,
                childValue
            );
    }

    else if (
        expr.type === "binary"
    ) {

        const leftValue =
            evaluateExpression(
                expressions[
                    expr.left
                ],
                vars,
                cache
            );

        const rightValue =
            evaluateExpression(
                expressions[
                    expr.right
                ],
                vars,
                cache
            );

        value =
            evalBinary(
                expr.op,
                leftValue,
                rightValue
            );
    }

    if (
        !Number.isFinite(value)
    ) {

        value = 0;
    }

    value =
        Math.trunc(value);

    cache[expr.id] =
        value;

    return value;
}


function getGroupValue(
    value,
    group
) {

    if (group === "2DD") {

        return value.substring(
            0,
            2
        );
    }

    if (group === "2DT") {

        return value.substring(
            1,
            3
        );
    }

    if (group === "2DB") {

        return value.substring(
            2,
            4
        );
    }

    return "";
}


function buildValueTable(
    data,
    group
) {

    const pairCount =
        data.length - 1;

    const table =
        new Array(pairCount);


    for (
        let pairIndex = 0;
        pairIndex < pairCount;
        pairIndex++
    ) {

        const current =
            getGroupValue(
                data[pairIndex],
                group
            );

        /*
           Data sebelumnya.

           Pada pasangan pertama,
           data sebelumnya dibuat sama
           dengan data sekarang.
        */

        const previous =
            pairIndex > 0
                ? getGroupValue(
                    data[pairIndex - 1],
                    group
                )
                : current;


        const vars = [

            Number(current[0]),
            Number(current[1]),

            Number(previous[0]),
            Number(previous[1])
        ];


        const cache =
            new Array(
                EXPRESSION_COUNT
            );


        for (
            let e = 0;
            e < EXPRESSION_COUNT;
            e++
        ) {

            evaluateExpression(
                expressions[e],
                vars,
                cache
            );
        }


        table[pairIndex] =
            cache;
    }

    return table;
}


/* =========================================================
   DECODER GEN
   =========================================================

   Formula GEN dibangun dengan cara sistematis.

   Urutan pasangan expression menggunakan
   diagonal sehingga formula sederhana
   diperiksa lebih dahulu.

   GEN 1:
       expression 0 + expression 0

   kemudian kombinasi berikutnya.

   Tidak ada random.
   Tidak ada pairIndex.
   Tidak ada target dalam formula.
   ========================================================= */

const diagonalCumulative = [];

(function buildDiagonalTable() {

    let total = 0;

    for (
        let s = 0;
        s <=
        (EXPRESSION_COUNT * 2 - 2);
        s++
    ) {

        const count =
            s <
            EXPRESSION_COUNT
                ? s + 1
                : (
                    2 *
                    EXPRESSION_COUNT -
                    1 -
                    s
                );

        total += count;

        diagonalCumulative.push(
            total
        );
    }

})();


function decodeFormula(
    gen
) {
    let safeGen = gen;
    if (safeGen > TOTAL_FORMULAS) {
        safeGen = ((safeGen - 1) % TOTAL_FORMULAS) + 1;
    }

    const zeroBased =
        safeGen - 1;

    const mode =
        zeroBased %
        OUTPUT_MODES;

    const pairNumber =
        Math.floor(
            zeroBased /
            OUTPUT_MODES
        );


    /*
       Cari diagonal.
    */

    let low = 0;
    let high =
        diagonalCumulative.length - 1;

    while (low < high) {

        const mid =
            Math.floor(
                (low + high) / 2
            );

        if (
            diagonalCumulative[mid] >
            pairNumber
        ) {

            high = mid;

        } else {

            low = mid + 1;
        }
    }

    const diagonal =
        low;

    const previousTotal =
        diagonal === 0
            ? 0
            : diagonalCumulative[
                diagonal - 1
            ];

    const offset =
        pairNumber -
        previousTotal;


    let e1;
    let e2;


    if (
        diagonal <
        EXPRESSION_COUNT
    ) {

        e1 = offset;

        e2 =
            diagonal -
            offset;

    } else {

        e1 =
            EXPRESSION_COUNT -
            1 -
            offset;

        e2 =
            diagonal -
            e1;
    }


    return {
        e1: e1,
        e2: e2,
        mode: mode
    };
}


/* =========================================================
   OUTPUT FORMULA
   ========================================================= */

function normalizeDigit(value) {

    return (
        Math.abs(
            Math.trunc(value)
        ) % 10
    );
}


function makeSeed(
    value1,
    value2,
    mode
) {

    let d1 =
        normalizeDigit(
            value1
        );

    let d2 =
        normalizeDigit(
            value2
        );


    switch (mode) {

        case 0:

            return (
                String(d1) +
                String(d2)
            );


        case 1:

            return (
                String(d2) +
                String(d1)
            );


        case 2:

            return (
                String(
                    (d1 + d2) % 10
                ) +
                String(d2)
            );


        case 3:

            return (
                String(d1) +
                String(
                    (d1 + d2) % 10
                )
            );


        case 4:

            return (
                String(
                    (d1 * d2) % 10
                ) +
                String(d2)
            );


        case 5:

            return (
                String(d1) +
                String(
                    (d1 * d2) % 10
                )
            );


        case 6:

            return (
                String(
                    Math.abs(
                        d1 - d2
                    )
                ) +
                String(
                    (d1 + d2) % 10
                )
            );


        case 7:

            return (
                String(
                    (d1 + d2) % 10
                ) +
                String(
                    Math.abs(
                        d1 - d2
                    )
                )
            );
    }

    return (
        String(d1) +
        String(d2)
    );
}


function getOutputModeText(
    mode
) {

    switch (mode) {

        case 0:
            return "[X,Y]";

        case 1:
            return "[Y,X]";

        case 2:
            return "[X+Y,Y]";

        case 3:
            return "[X,X+Y]";

        case 4:
            return "[X×Y,Y]";

        case 5:
            return "[X,X×Y]";

        case 6:
            return "[|X-Y|,X+Y]";

        case 7:
            return "[X+Y,|X-Y|]";
    }

    return "[X,Y]";
}


function getFormulaText(
    formula
) {

    const e1 =
        expressions[
            formula.e1
        ];

    const e2 =
        expressions[
            formula.e2
        ];

    return (
        "X = " +
        e1.text +
        "\n" +
        "Y = " +
        e2.text +
        "\n" +
        "OUT = " +
        getOutputModeText(
            formula.mode
        )
    );
}


/* =========================================================
   TEST SATU FORMULA
   ========================================================= */

function testFormula(
    formula,
    valueTable,
    targets
) {

    const pairCount =
        targets.length;

    let totalHit = 0;

    let currentConsecutive = 0;

    let longestConsecutive = 0;


    const firstValues =
        valueTable[0];


    const firstX =
        firstValues[
            formula.e1
        ];

    const firstY =
        firstValues[
            formula.e2
        ];

    const firstSeed =
        makeSeed(
            firstX,
            firstY,
            formula.mode
        );


    for (
        let i = 0;
        i < pairCount;
        i++
    ) {

        const values =
            valueTable[i];


        const x =
            values[
                formula.e1
            ];

        const y =
            values[
                formula.e2
            ];


        const seed =
            makeSeed(
                x,
                y,
                formula.mode
            );


        const hit =
            isHit(
                seed,
                targets[i]
            );


        if (hit) {

            totalHit++;

            currentConsecutive++;

            if (
                currentConsecutive >
                longestConsecutive
            ) {

                longestConsecutive =
                    currentConsecutive;
            }

        } else {

            currentConsecutive = 0;
        }
    }


    return {

        seed: firstSeed,

        totalHit: totalHit,

        longestConsecutive:
            longestConsecutive,

        pairCount: pairCount
    };
}


/* =========================================================
   TARGET TABLE
   ========================================================= */

function buildTargets(
    data,
    group
) {

    const pairCount =
        data.length - 1;

    const targets =
        new Array(pairCount);

    for (
        let i = 0;
        i < pairCount;
        i++
    ) {

        targets[i] =
            getGroupValue(
                data[i + 1],
                group
            );
    }

    return targets;
}


/* =========================================================
   ANALISA GROUP
   ========================================================= */

async function analyzeGroup(
    data,
    group,
    minHit,
    maxGen
) {

    const pairCount =
        data.length - 1;


    const valueTable =
        buildValueTable(
            data,
            group
        );


    const targets =
        buildTargets(
            data,
            group
        );


    let best = null;

    let bestGen = 1;


    const actualMaxGen = maxGen;


    for (
        let gen = 1;
        gen <= actualMaxGen;
        gen++
    ) {

        if (stopRequested) {

            if (!best) {

                const fallback =
                    decodeFormula(1);

                const fallbackScore =
                    testFormula(
                        fallback,
                        valueTable,
                        targets
                    );

                best = {
                    formula: fallback,
                    score: fallbackScore
                };

                bestGen = 1;
            }

            return {

                stopped: true,

                group: group,

                gen: bestGen,

                formula:
                    best.formula,

                seed:
                    best.score.seed,

                hit:
                    best.score.totalHit,

                longest:
                    best.score.longestConsecutive,

                total:
                    pairCount,

                totalFormulas:
                    TOTAL_FORMULAS
            };
        }


        const formula =
            decodeFormula(gen);


        const score =
            testFormula(
                formula,
                valueTable,
                targets
            );


        /*
           Formula terbaik dipilih berdasarkan:

           1. hit berurutan terpanjang
           2. total hit
           3. GEN lebih kecil
        */

        let isBetter = false;

        if (!best) {

            isBetter = true;

        } else if (
            score.longestConsecutive >
            best.score.longestConsecutive
        ) {

            isBetter = true;

        } else if (
            score.longestConsecutive ===
            best.score.longestConsecutive &&
            score.totalHit >
            best.score.totalHit
        ) {

            isBetter = true;
        }


        if (isBetter) {

            best = {

                formula: formula,

                score: score
            };

            bestGen = gen;
        }


        // FITUR BERHENTI OTOMATIS (EARLY STOP) TELAH DIHAPUS DI SINI.
        // SEKARANG ENGINE AKAN TERUS BERJALAN SAMPAI maxGen TERCAPAI
        // UNTUK MENCARI FORMULA YANG BENAR-BENAR TERBAIK.


        if (
            gen % 10 === 0 ||
            gen === actualMaxGen
        ) {

            const percentage =
                (
                    gen /
                    actualMaxGen
                ) * 100;


            setProgress(
                percentage,
                group +
                " | GEN " +
                gen +
                "/" +
                actualMaxGen +
                " | HIT TERBAIK " +
                best.score.totalHit +
                "/" +
                pairCount +
                " | BERURUTAN " +
                best.score.longestConsecutive
            );


            progressInfo.textContent =
                "Kelompok       : " +
                group +
                "\n" +

                "GEN sekarang   : " +
                gen +
                "/" +
                actualMaxGen +
                "\n" +

                "Formula GEN    :\n" +
                getFormulaText(
                    formula
                ) +
                "\n\n" +

                "Seed pertama   : " +
                score.seed +
                "\n" +

                "Total hit      : " +
                score.totalHit +
                "/" +
                pairCount +
                "\n" +

                "Hit berurutan  : " +
                score.longestConsecutive +
                "\n" +

                "Best berurutan : " +
                best.score.longestConsecutive +
                "\n" +

                "Target minimal : " +
                minHit +
                "\n\n" +

                "Formula yang sama diuji " +
                "ke seluruh pasangan data.";
        }


        if (
            gen % 50 === 0
        ) {

            await sleep(0);
        }
    }


    return {

        stopped: false,

        group: group,

        gen: bestGen,

        formula:
            best.formula,

        seed:
            best.score.seed,

        hit:
            best.score.totalHit,

        longest:
            best.score.longestConsecutive,

        total:
            pairCount,

        finishedBy: "GEN",

        totalFormulas:
            TOTAL_FORMULAS
    };
}

   HASIL
   ========================================================= */

function buildResultText(
    result
) {

    if (!result) {
        return "";
    }

    const generated =
        generate49(
            result.seed
        );

    return generated
        .combinations
        .join("*");
}


function buildTitle(
    group,
    result
) {

    if (!result) {
        return group;
    }

    return (
        group +
        " Gen:" +
        result.gen +
        " " +
        result.longest +
        "/" +
        result.total +
        " Seed:" +
        result.seed
    );
}

function setProgress(
    percent,
    state
) {

    progressBar.style.width =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        ) + "%";

    progressPercent.textContent =
        Math.round(percent) +
        "%";

    progressState.textContent =
        state;
}


function sleep(ms) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                ms
            );
        }
    );
}


function showPairInfo(
    data,
    group
) {

        "Kelompok : " +

    for (
        let i = 0;
        i < jumlahPasangan;
        i++
    ) {

        const source =
            getGroupValue(
                data[i],
                group
            );

        const target =
            getGroupValue(
                data[i + 1],
                group
            );

        text +=
            (i + 1) +
            ". " +
            source +
            " → " +
            target +
            "\n";
    }

    progressInfo.textContent =
        text;
}
