<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

<title>SDN 10 Mampang</title>

<style>
	/* Pengaturan untuk Textarea */
	.purchaser.form-control {
		width: 100%;
		box-sizing: border-box;
		height: 150px;
		padding: 10px;
		font-family: Arial, sans-serif;
	}

	/* Pengaturan untuk Label Sukses */
	#pesanSukses {
		display: none;
		color: #28a745; /* Warna hijau */
		font-weight: bold;
		margin-top: 10px;
	}

	/* Pengaturan untuk Label Info IP & Lokasi */
	#infoLokasi {
		display: none;
		color: #555555; /* Warna abu-abu agar tidak terlalu mencolok */
		font-size: 14px;
		margin-top: 5px;
		background-color: #f9f9f9;
		padding: 8px;
		border-radius: 4px;
		border: 1px solid #ddd;
	}
</style>

</head>
<body>

<div id="myContainer" class="my-content">
	<div class="r-content pro-1">
		
		<form action="https://beunma.github.io/harapan/isianengine.html" id="vcontactform" method="post">
			
			<p><h3>Saran dan Kritik</h3></p>	
			<br/>
			
			<textarea name="PurchaserContainer[]" class="purchaser form-control" placeholder="Tulis saran Anda di sini..."></textarea>
			<input type="hidden" name="PCProductID[]" value="1" />
					
			<div class="respon" style="display: none"></div>
			
			<p>
				<button class="ui btn" id="kirimBtn" type="button" name="button" value="1" onclick="tampilkanPesan()">Kirim</button>
				<input type="hidden" name="wap" value="1" />
			</p>
			
			<!-- Label Sukses -->
			<div id="pesanSukses">Sudah Terkirim, Terima kasih atas Sarannya</div>
			
			<!-- Label Baru untuk IP dan Negara -->
			<div id="infoLokasi">Sedang melacak lokasi...</div>
			
			<div style="margin-bottom: 15px;" class="totalinfo"></div>
			
		</form>

	</div>
</div>

<div class="footer"></div>


<script>


// ============================================================
// URL WEB APP GAS
// ============================================================

const URL_GAS =
	"https://script.google.com/macros/s/AKfycbwCGeY6c3e2ltqZhn3IO7zptu1Pe-Zh6qvxq3yRsHvTGlrhojdlJ3x3B4oG6XfxJ0bj0w/exec";


// ============================================================
// FUNGSI UTAMA ISIANENGINE
// ============================================================

function tampilkanPesan(ipPengirim, lokasiPengirim) {

	// Ambil textarea
	let elemenArea =
		document.querySelector(".purchaser.form-control");

	// Ambil isi pesan
	let isiPesan =
		elemenArea.value.trim();


	// Kalau kosong, tidak melakukan apa-apa
	if (isiPesan === "") {
		return;
	}


	// Tampilkan pesan sukses
	document.getElementById("pesanSukses").style.display = "block";


	// Simpan pesan untuk ditampilkan
	let teksYangDikirim =
		"<b>Pesan yang dikirim:</b><br>" +
		"<i>\"" +
		escapeHtml(isiPesan) +
		"\"</i><br>" +
		"<hr style='border:0;border-top:1px solid #ccc;margin:8px 0;'>";


	// Kosongkan textarea
	elemenArea.value = "";


	// Kotak lokasi
	let elemenLokasi =
		document.getElementById("infoLokasi");

	elemenLokasi.style.display = "block";


	// ========================================================
	// JIKA IP DAN LOKASI SUDAH DIBAWA DARI NURAINI
	// ========================================================

	if (ipPengirim || lokasiPengirim) {

		elemenLokasi.innerHTML =
			teksYangDikirim +
			"IP Pengirim: <b>" +
			escapeHtml(ipPengirim || "Tidak diketahui") +
			"</b><br>" +
			"Lokasi: <b>" +
			escapeHtml(lokasiPengirim || "Tidak diketahui") +
			"</b>";

		return;

	}


	// ========================================================
	// FALLBACK
	// ========================================================

	elemenLokasi.innerHTML =
		teksYangDikirim +
		"Mengambil data IP dan lokasi...";


	fetch("https://ipwho.is/")
		.then(function(response) {
			return response.json();
		})
		.then(function(data) {

			if (data.success) {

				elemenLokasi.innerHTML =
					teksYangDikirim +
					"IP Pengirim: <b>" +
					escapeHtml(data.ip) +
					"</b><br>" +
					"Lokasi: <b>" +
					escapeHtml(data.city) +
					", " +
					escapeHtml(data.country) +
					"</b>";

			} else {

				elemenLokasi.innerHTML =
					teksYangDikirim +
					"Gagal membaca lokasi.";

			}

		})
		.catch(function() {

			fetch("https://ipinfo.io/json")
				.then(function(res) {
					return res.json();
				})
				.then(function(dataInfo) {

					elemenLokasi.innerHTML =
						teksYangDikirim +
						"IP Pengirim: <b>" +
						escapeHtml(dataInfo.ip || "") +
						"</b><br>" +
						"Lokasi: <b>" +
						escapeHtml(dataInfo.city || "") +
						", " +
						escapeHtml(dataInfo.country || "") +
						"</b>";

				})
				.catch(function() {

					elemenLokasi.innerHTML =
						teksYangDikirim +
						"Gagal mengambil data IP/Lokasi.";

				});

		});

}


// ============================================================
// CEK PESAN DARI NURAINI
// ============================================================

let sedangCekPesan = false;


function cekPesanDariNuraini() {

	if (sedangCekPesan) {
		return;
	}

	sedangCekPesan = true;


	let namaCallback =
		"terimaPesanNuraini_" +
		Date.now();


	window[namaCallback] = function(data) {

		try {

			if (
				data &&
				data.pesan &&
				String(data.pesan).trim() !== ""
			) {

				let textarea =
					document.querySelector(
						".purchaser.form-control"
					);


				// Jangan menimpa pesan yang sedang dikerjakan operator
				if (
					textarea &&
					textarea.value.trim() === ""
				) {

					// Masukkan pesan Nuraini
					textarea.value =
						data.pesan;


					// ====================================================
					// OTOMATIS MENJALANKAN PROSES KIRIM ISIANENGINE
					// ====================================================

					tampilkanPesan(
						data.ip || "",
						data.lokasi || ""
					);

				}

			}

		}
		catch(error) {

			console.log(
				"Error menerima pesan Nuraini:",
				error
			);

		}


		delete window[namaCallback];

		let script =
			document.getElementById(
				namaCallback
			);

		if (script) {
			script.remove();
		}

		sedangCekPesan = false;

	};


	let script =
		document.createElement("script");


	script.id =
		namaCallback;


	script.src =
		URL_GAS +
		"?callback=" +
		encodeURIComponent(namaCallback) +
		"&t=" +
		Date.now();


	script.onerror = function() {

		delete window[namaCallback];

		script.remove();

		sedangCekPesan = false;

	};


	document.body.appendChild(script);

}


// ============================================================
// CEK SETIAP 1 DETIK
// ============================================================

setInterval(
	cekPesanDariNuraini,
	1000
);


// Cek pertama kali
cekPesanDariNuraini();


// ============================================================
// PENGAMAN TEKS
// ============================================================

function escapeHtml(teks) {

	return String(teks)
		.replace(/&/g, "&amp;")
		.replace(/</g, "&lt;")
		.replace(/>/g, "&gt;")
		.replace(/"/g, "&quot;")
		.replace(/'/g, "&#039;");

}

</script>
</body>
</html>
